name: fraud-service

services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-service:dev
    environment:
      FRAUD_ENVIRONMENT: production
      FRAUD_HOST: 0.0.0.0
      FRAUD_PORT: "8000"
      FRAUD_MODEL_PATH: /app/models/fraud_xgb_v3.joblib
    ports:
      - "8000:8000"
    depends_on:
      feature-cache:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready', timeout=2)" ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks:
      - fraud-network

  feature-cache:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - fraud-network

  loadtest:
    image: grafana/k6:0.52.0
    profiles: [ "loadtest" ]
    depends_on:
      fraud-api:
        condition: service_healthy
    environment:
      TARGET_URL: http://fraud-api:8000
    volumes:
      - ./scripts:/scripts:ro
    command: [ "run", "--vus", "${LOADTEST_VUS:-10}", "--iterations", "${LOADTEST_ITERATIONS:-500}", "--summary-trend-stats=avg,min,med,max,p(90),p(95),p(99)", "/scripts/loadtest.js" ]
    networks:
      - fraud-network

networks:
  fraud-network:
    driver: bridge
