services:
  fraud-api:
    build: .
    image: fraud-service:dev
    ports:
      - "8000:8000"
    depends_on:
      feature-cache:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/v1/ready" ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  feature-cache:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
