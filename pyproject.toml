[project]
name = "fraud-service"
version = "0.1.0"
description = "Cleanly layered fraud-scoring service"
requires-python = ">=3.12"
dependencies = [
    "joblib",
    "pandas",
    "pydantic>=2",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
