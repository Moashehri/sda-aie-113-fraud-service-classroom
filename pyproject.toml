[project]
name = "fraud-service"
version = "0.1.0"
description = "Cleanly layered fraud-scoring service"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "httpx",
    "joblib",
    "pandas",
    "pydantic>=2",
    "scikit-learn",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: pure, fast unit tests",
    "integration: component and API contract tests",
    "behavioural: tests using the real model artefact",
]
